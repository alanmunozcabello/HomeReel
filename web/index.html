<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HomeReel</title><style>
*{box-sizing:border-box}body{margin:0;background:#141414;color:#fff;font:16px system-ui,Arial}header{display:flex;gap:10px;align-items:center;padding:14px 5%;background:#090909;position:sticky;top:0;z-index:3}h1{font-size:20px;color:#e50914;margin:0}.tab,button,select{border:0;border-radius:4px;padding:9px 12px;color:white;cursor:pointer;background:#333}.tab.active,button{background:#e50914}button:disabled{opacity:.7;cursor:wait}button.loading::after{content:'';display:inline-block;width:11px;height:11px;margin-left:7px;border:2px solid #fff;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}select{background:#191919;border:1px solid #555;min-width:150px}input{margin-left:auto;background:#222;border:1px solid #555;border-radius:4px;padding:9px;color:#fff;width:min(250px,35vw)}main{padding:24px 5%}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}.card{background:#252525;border-radius:5px;overflow:hidden;cursor:pointer}.card:hover{transform:scale(1.02)}.art{aspect-ratio:16/9;background:linear-gradient(145deg,#63131b,#171717);overflow:hidden;position:relative}.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .2s;z-index:1}.art img.ready{opacity:1}.play{position:absolute;inset:0;display:grid;place-items:center;font-size:46px;color:#fff;text-shadow:0 1px 5px #000;z-index:2;pointer-events:none}.name,.meta{padding:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{padding-top:0;color:#aaa;font-size:12px}.hidden{display:none!important}.section{margin:25px 0 12px}.season{margin:12px 0}.season button{background:#333;margin-right:7px}.season button.active{background:#e50914}video{display:block;width:100%;max-height:75vh;background:#000}.bar,.admin{padding:12px;background:#252525;display:flex;align-items:center;gap:9px;flex-wrap:wrap}.live{color:#ff5860;font-weight:bold}.admin{margin-top:10px}.notice{color:#bbb;line-height:1.6}@media(max-width:650px){h1{display:none}header{padding:10px 3%;gap:5px}main{padding:18px 3%}}
</style></head><body><header><h1>HOMEREEL</h1><button class="tab active" data-view="vod">Biblioteca</button><button class="tab" data-view="tv">TV en vivo</button><input id="query" placeholder="Buscar"><button id="scan">Actualizar</button><button id="admin-toggle">Admin</button></header><main><section id="vod"><p id="status">Cargando...</p><div id="library"></div></section><section id="tvview" class="hidden"><video id="player" controls playsinline></video><div class="bar"><span class="live">EN VIVO</span><span id="program">Conectando...</span><button id="sync">Sincronizar</button></div><div id="admin" class="admin hidden"><strong>Control administrador</strong><button data-action="pause">Pausar</button><button data-action="play">Reproducir</button><button data-action="seek" data-delta="-30">-30 s</button><button data-action="seek" data-delta="30">+30 s</button><button data-action="auto">Volver a programacion</button><select id="admin-collection"><option value="">Coleccion / serie...</option></select><select id="admin-season"><option value="">Temporada...</option></select><select id="select-video"><option value="">Capitulo o pelicula...</option></select><button id="emit-video">Emitir seleccion</button><hr><strong>Carpeta de medios</strong><input id="media-dir" placeholder="Ruta del servidor"><button id="pick-media">Elegir carpeta</button><button id="save-media">Usar ruta</button></div></section></main><script>
const $=s=>document.querySelector(s),library=$('#library'),status=$('#status'),player=$('#player'),program=$('#program');let media=[],activeTV=false,tvState=null,selectedSeries=null,selectedSeason=null;
const time=s=>{s=Math.round(s||0);return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`};
function card(x){const e=document.createElement('article');e.className='card';e.innerHTML='<div class="art"><span class="play">&#9654;</span></div><div class="name"></div><div class="meta"></div>';const art=e.querySelector('.art'),img=new Image();img.loading='lazy';img.alt='';img.onload=()=>img.classList.add('ready');art.append(img);img.src='/api/v1/thumbnail/'+x.id;e.querySelector('.name').textContent=x.title;e.querySelector('.meta').textContent=`${time(x.duration)} - ${x.video_codec||'video'}`;e.onclick=()=>play(x);return e}
function render(){const q=$('#query').value.toLowerCase(),items=media.filter(x=>x.title.toLowerCase().includes(q));library.innerHTML='';status.textContent=`${items.length} video${items.length!==1?'s':''}`;const movies=items.filter(x=>x.type==='movie'),other=items.filter(x=>x.type==='other'),series=[...new Set(items.filter(x=>x.type==='series').map(x=>x.collection))];for(const name of [...new Set(movies.map(x=>x.collection))]){const group=movies.filter(x=>x.collection===name),box=document.createElement('section');box.innerHTML=`<h2 class="section">Peliculas - ${name}</h2>`;const g=document.createElement('div');g.className='grid';group.forEach(x=>g.append(card(x)));box.append(g);library.append(box)}if(other.length){const box=document.createElement('section');box.innerHTML='<h2 class="section">Otros videos</h2>';const g=document.createElement('div');g.className='grid';other.forEach(x=>g.append(card(x)));box.append(g);library.append(box)}for(const name of series){const all=items.filter(x=>x.type==='series'&&x.collection===name);const box=document.createElement('section');box.innerHTML=`<h2 class="section">${name}</h2>`;const seasons=[...new Set(all.map(x=>x.season))];const nav=document.createElement('div');nav.className='season';seasons.forEach(s=>{const b=document.createElement('button');b.textContent=s;b.className=(selectedSeries===name&&selectedSeason===s)||(!selectedSeries&&s===seasons[0])?'active':'';b.onclick=()=>{selectedSeries=name;selectedSeason=s;render()};nav.append(b)});box.append(nav);const chosen=selectedSeries===name?selectedSeason:seasons[0],g=document.createElement('div');g.className='grid';all.filter(x=>x.season===chosen).forEach(x=>g.append(card(x)));box.append(g);library.append(box)}if(!items.length)library.innerHTML='<p class="notice">No hay videos indexados. Usa Actualizar.</p>';fillSelect()}
function option(select,value,label){const o=document.createElement('option');o.value=value;o.textContent=label;select.append(o)}function fillSelect(){const c=$('#admin-collection'),old=c.value;c.innerHTML='<option value="">Coleccion / serie...</option>';const groups=[...new Map(media.map(x=>[`${x.type}|${x.collection}`,x])).values()];groups.forEach(x=>option(c,`${x.type}|${x.collection}`,`${x.type==='series'?'Serie':x.type==='movie'?'Pelicula':'Otros'}: ${x.collection}`));c.value=old;if(!c.value&&groups.length)c.value=`${groups[0].type}|${groups[0].collection}`;fillSeasons()}function fillSeasons(){const c=$('#admin-collection').value,s=$('#admin-season'),old=s.value,items=media.filter(x=>`${x.type}|${x.collection}`===c);s.innerHTML='<option value="">Temporada...</option>';[...new Set(items.map(x=>x.season||'Video'))].forEach(x=>option(s,x,x));s.value=old;if(!s.value&&s.options.length>1)s.selectedIndex=1;fillEpisodes()}function fillEpisodes(){const c=$('#admin-collection').value,s=$('#admin-season').value,v=$('#select-video');v.innerHTML='<option value="">Capitulo o pelicula...</option>';media.filter(x=>`${x.type}|${x.collection}`===c&&(x.season||'Video')===s).forEach(x=>option(v,x.id,x.title))}
async function load(){const r=await fetch('/api/v1/library');if(!r.ok)throw Error();media=await r.json()||[];render()}async function loadMediaDir(){const r=await fetch('/api/v1/settings/media'),x=await r.json();$('#media-dir').value=x.media_dir||''}async function setMediaDir(dir){const r=await fetch('/api/v1/settings/media',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({media_dir:dir})});if(!r.ok)throw Error(await r.text());const x=await r.json();$('#media-dir').value=x.media_dir;await fetch('/api/v1/library/scan',{method:'POST'});await load()}
function play(x){activeTV=false;show('tv');program.textContent=x.title;player.src='/api/v1/stream/'+x.id;player.play().catch(()=>{})}
async function sync(force=false){if(!activeTV)return;try{const r=await fetch('/api/v1/tv/live',{cache:'no-store'}),x=await r.json();if(!x.stream_url){program.textContent='Sin videos';return}const changed=!tvState||tvState.id!==x.now_playing_id;tvState=x;program.textContent=(media.find(m=>m.id===x.now_playing_id)||{}).title||'En vivo';if(changed){player.src=x.stream_url;player.onloadedmetadata=()=>{player.currentTime=x.seek_seconds;if(x.paused)player.pause();else player.play().catch(()=>{})}}else if(force&&!player.ended&&player.readyState>=2&&!player.seeking&&Math.abs(player.currentTime-x.seek_seconds)>2)player.currentTime=x.seek_seconds;if(x.paused)player.pause();else if(force)player.play().catch(()=>{})}catch{program.textContent='Error de sincronizacion'}}
function show(v){$('#vod').classList.toggle('hidden',v!=='vod');$('#tvview').classList.toggle('hidden',v!=='tv');$('#query').classList.toggle('hidden',v!=='vod');document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view===v));if(v==='tv'&&activeTV)sync();if(v==='vod')player.pause()}
async function control(action,extra={}){await fetch('/api/v1/tv/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,...extra})});activeTV=true;await sync(true)}
function waitForNext(){if(!activeTV)return;sync(false).then(()=>{if(player.ended)setTimeout(waitForNext,1000)})}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{activeTV=b.dataset.view==='tv';show(b.dataset.view)});$('#query').oninput=render;$('#sync').onclick=()=>{activeTV=true;sync(true)};$('#scan').onclick=async()=>{status.textContent='Escaneando...';await fetch('/api/v1/library/scan',{method:'POST'});load()};$('#admin-toggle').onclick=()=>$('#admin').classList.toggle('hidden');document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>control(b.dataset.action,b.dataset.delta?{seek_seconds:Math.max(0,Math.round(player.currentTime)+Number(b.dataset.delta))}:{ }));$('#admin-collection').onchange=fillSeasons;$('#admin-season').onchange=fillEpisodes;$('#emit-video').onclick=()=>{const id=Number($('#select-video').value);if(id)control('select',{media_id:id})};$('#save-media').onclick=async()=>{try{await setMediaDir($('#media-dir').value)}catch(e){alert(e.message)}};$('#pick-media').onclick=async e=>{const b=e.currentTarget;b.disabled=true;b.classList.add('loading');try{const r=await fetch('/api/v1/settings/media/pick',{method:'POST'});if(r.status===204)return;if(!r.ok)throw Error(await r.text());const x=await r.json();$('#media-dir').value=x.media_dir;await fetch('/api/v1/library/scan',{method:'POST'});await load()}catch(e){alert(e.message)}finally{b.disabled=false;b.classList.remove('loading')}};player.onended=waitForNext;(async()=>{try{await loadMediaDir();await fetch('/api/v1/library/scan',{method:'POST'});await load()}catch{status.textContent='No se pudo conectar'}})();
</script></body></html>
