name: macOS package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version for the package
        required: true
        default: 0.1.0
      upload_to_release:
        description: Attach the packages to the release named by version
        type: boolean
        required: true
        default: false
  release:
    types: [created]

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [arm64, amd64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: bash scripts/package-macos.sh "${{ inputs.version || github.event.release.tag_name }}" "${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: HomeReel-macos-${{ matrix.arch }}
          path: dist/HomeReel-macos-${{ matrix.arch }}.pkg
          if-no-files-found: error
      - name: Attach package to release
        if: github.event_name == 'release' || inputs.upload_to_release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.version }}
        run: gh release upload "$RELEASE_TAG" "dist/HomeReel-macos-${{ matrix.arch }}.pkg" --clobber
